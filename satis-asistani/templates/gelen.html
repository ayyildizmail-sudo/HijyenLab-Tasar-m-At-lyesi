{% extends "base.html" %}
{% block icerik %}
<h2>Gelen mailler</h2>
<div class="kart tablo"><table>
<tr><th>Tarih</th><th>Kimden</th><th>Konu</th><th>Kategori</th><th>Önem</th><th>Özet</th></tr>
{% for g in liste %}
<tr><td class="soluk">{{ g.tarih[:16] }}</td><td>{{ g.musteri_ad or g.kimden }}</td><td>{{ g.konu }}</td>
<td><span class="etiket">{{ g.kategori }}</span></td><td>{{ g.onem or "" }}</td><td>{{ g.ozet }}</td></tr>
{% else %}<tr><td colspan="6" class="soluk">Henüz işlenmiş mail yok.</td></tr>{% endfor %}
</table></div>
{% endblock %}
